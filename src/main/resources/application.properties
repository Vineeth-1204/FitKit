spring.application.name=fitkit-nutrition-core

# ==============================================================================
# Database Configuration (MySQL 8.0 Primary)
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fitkit_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Server Port
server.port=8080

# Logging
logging.level.com.fitkit=INFO
logging.level.org.flywaydb=INFO

# Security & Seed Controls (Disabled by default; enable via SEED_DEMO_ACCOUNT or 'dev' profile)
fitkit.auth.seed-demo=${SEED_DEMO_ACCOUNT:false}

