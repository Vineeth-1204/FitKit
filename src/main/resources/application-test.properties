spring.application.name=fitkit-nutrition-core-test

# ==============================================================================
# In-Memory Database Configuration for Testing (H2 in MySQL 8.0 Compatibility Mode)
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:fitkit_test_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Logging
logging.level.com.fitkit=DEBUG
logging.level.org.flywaydb=INFO
